# spec-creator.yaml - L1 (spec-creation loop) plan for the spec-factory prototype.
#
# L1 authors SPEC TEXT ONLY (never edits product source). It drafts increment N+1
# only when the Issue 4 lease gate permits (L2 has claimed N and/or built it).
# Real speckit.* flow per ADR-0002 (Mode-2 minimal: short seed -> specify -> plan -> tasks).
#
# Runs as its own daemon process (port 3001, cron) - SEPARATE from L2 (port 3002).
# Two daemons = isolated module globals in agent-loop v8 (ADR-0001 Amendment).
# Daemon autonomy (cron unref + space-path spawn) is FIXED — this loop now runs
# AUTONOMOUSLY: cron fires (timer no longer unref'd) and space-paths survive the
# task spawn. Launch as its own daemon process (see _loops.yaml spec-factory-l1).
#
# Space-in-path: commands quote the specs workspace literally. The engine writes
# each command to a temp .cmd so quotes/spaces survive; the launch wrapper
# (issue5-run.ps1) passes --plan as a single argv, never inline-split.
planName: spec-creator

tasks:
  - id: read-state
    command: type STATE.md
    timeoutMs: 10000

  - id: gate-evolve
    # Issue 4 + Issue 6 lease/pacing gate: L1 may draft N+1 only when:
    #   - no unconsumed evolve-* exists (pacing: never two coexist), AND
    #   - no active lease, OR built-N exists for the current N.
    # The gate script exits 0 (may draft) or 1 (must wait). When it exits 1,
    # the plan task FAILS. The plan executor treats this as "L1 pauses" (no draft
    # until next cron tick). DO NOT add `; exit 0` — that would neutralize the
    # gate and let L1 draft unconditionally, violating the Issue 6 pacing contract.
    # Issue 6 pacing: L1 writes exactly ONE evolve-N per cron cycle, only after
    # built-(N-1) exists. The gate enforces "no two unconsumed evolve-*".
    command: >-
      powershell.exe -NoProfile -File "D:\projects\obsidian\second brain\10-Projects\11-Active\parallel loops\spec-factory\.scratch\l1-evolve-gate.ps1"
      -Specs "D:\projects\obsidian\second brain\10-Projects\11-Active\parallel loops\spec-factory\specs"
    timeoutMs: 30000

  - id: read-inbox
    # ADR-0018: idea intake = filesystem inbox. Read the TOP idea line from
    # specs/ideas/inbox.md. If the inbox is empty (or missing), this task MUST exit 0
    # and emit no IDEA env value -> draft-increment idles this cycle (no evolve written,
    # no false failure). If a line exists, peel it off the inbox and write it to a temp
    # file the next task can consume. Space-in-path safe (LiteralPath / Join-Path).
    command: >-
      powershell.exe -NoProfile -File
      "D:\projects\obsidian\second brain\10-Projects\11-Active\agent-loop\plans\l1-read-inbox.ps1"
      -Specs "D:\projects\obsidian\second brain\10-Projects\11-Active\parallel loops\spec-factory\specs"
      -Out "D:\projects\obsidian\second brain\10-Projects\11-Active\parallel loops\spec-factory\specs\ideas\.next-idea.txt"
    timeoutMs: 30000

  - id: draft-increment
    # ADR-0018: real speckit.* flow (ADR-0002 Mode-2 minimal). L1 extends the highest
    # existing evolve-N by one FROM a human-supplied one-line idea (never invents topics).
    # Runs the identical manual flow as the repo demo - three separate `opencode run`
    # calls (/speckit.specify <idea>, /speckit.plan, /speckit.tasks) from the spec-factory
    # workspace CWD (no --dir per PLAN-WRITING-GUIDE P2: chokes on space paths).
    # Constitution is respected automatically (.specify/memory/constitution.md).
    #
    # PASSES if and only if a .next-idea.txt exists (read-inbox produced one). If it is
    # absent the script exits 0 and writes nothing -> L1 idles this cycle (pacing OK).
    # A real speckit failure must surface as a non-zero exit so the task fails honestly.
    #
    # Pacing (Issue 6): gate-evolve already ran and passed; read-inbox handed us exactly
    # ONE idea; this task writes exactly ONE evolve-N. Do NOT loop over multiple ideas.
    command: >-
      powershell.exe -NoProfile -File
      "D:\projects\obsidian\second brain\10-Projects\11-Active\agent-loop\plans\l1-draft-increment.ps1"
      -Specs "D:\projects\obsidian\second brain\10-Projects\11-Active\parallel loops\spec-factory\specs"
      -IdeaFile "D:\projects\obsidian\second brain\10-Projects\11-Active\parallel loops\spec-factory\specs\ideas\.next-idea.txt"
      -Workspace "D:\projects\obsidian\second brain\10-Projects\11-Active\parallel loops\spec-factory"
    timeoutMs: 600000

  - id: verify-draft
    # Verify L1's handoff invariant WITHOUT penalizing idle cycles (ADR-0018).
    # draft-increment idles (writes nothing) when the inbox is empty or the gate blocked.
    # So "no evolve-N at all" is a VALID idle result here -> exit 0, not a failure.
    # The check only enforces the Issue 6 pacing invariant: if any evolve-* exist,
    # at most ONE may be unconsumed (no matching built-N). Pacing violation -> exit 1.
    command: >-
      powershell.exe -NoProfile -Command
      "$specs='D:\projects\obsidian\second brain\10-Projects\11-Active\parallel loops\spec-factory\specs';
       $ev = @(Get-ChildItem -LiteralPath $specs -File -Filter 'evolve-*.md' -ErrorAction SilentlyContinue);
       if ($ev.Count -eq 0) { Write-Host 'verify-draft: idle cycle (no evolve-N) - pacing OK, nothing to verify'; exit 0 };
       $unconsumed = 0;
       foreach ($f in $ev) { $m = [regex]::Match($f.Name,'^evolve-(\d{3})'); if ($m.Success -and -not (Test-Path -LiteralPath (Join-Path $specs ('built-'+$m.Groups[1].Value)))) { $unconsumed++ } };
       if ($unconsumed -ge 2) { Write-Error ('verify-draft: pacing violation - '+$unconsumed+' unconsumed evolve-* coexist'); exit 1 };
       Write-Host 'verify-draft: evolve-N.md checkpoint present (L1 handoff ready, pacing OK)'"
    timeoutMs: 30000
