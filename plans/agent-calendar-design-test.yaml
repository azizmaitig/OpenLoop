planName: agent-calendar-design-test
# v11 test plan (T8 #41) — proof of the native opencode round-trip on a
# non-git target. calendar-app is a git repo with ZERO commits, so the
# runner treats it as non-git: backup-before-touch (.bak) instead of a
# worktree (PRD D4: "0 commits → backup").
l2:
  checklist: done
target:
  path: "D:\\projects\\obsidian\\second brain\\10-Projects\\11-Active\\calendar-app"
  isolated: true
tasks:
  - id: read-state
    command: type "D:\\projects\\obsidian\\second brain\\10-Projects\\11-Active\\agent-loop\\STATE.md"
    timeoutMs: 5000
  - id: design-audit
    type: agent
    # The DONE convention is appended automatically by the executor
    # (buildAgentPrompt + DONE_CONVENTION_INSTRUCTION). The bounded
    # transcript (PatchParts + failed tool outputs) is collected into the
    # PhaseResult — the audit report below must be anchored in REAL
    # tool-call evidence, never generic prose.
    prompt: >-
      You are a senior design auditor working on the calendar-app project at
      D:\projects\obsidian\second brain\10-Projects\11-Active\calendar-app.

      READ-ONLY TASK: do NOT create, edit, or delete any files. You are in L1
      report-only mode; your deliverable is a written design proposal returned
      as your final response.

      (The safety denylist is injected automatically by the loop — do not
      repeat it here.)

      Steps:
      1. Read README.md, PRODUCT.md, DESIGN.md, DESIGN-AUDIT.md, then explore
         the src/ layout (components, hooks, styles, App.tsx). Every file you
         claim to have audited must be one you ACTUALLY read via a tool call —
         the loop collects your real tool calls as evidence.
      2. Produce a prioritized design audit (P0-P3) covering at minimum:
         - Visual hierarchy and layout consistency
         - Theming / dark mode (check DESIGN.md tokens vs actual usage)
         - CSS token consistency (hardcoded values vs var() references)
         - Accessibility (WCAG gaps: contrast, focus, aria)
         - Performance (memoization, render work)
         - Code organization (file size, naming, component boundaries)
         For each finding: file:line, current code, recommended fix. Cite the
         exact paths you read — fabricated file references will be caught by
         the transcript audit.
      3. End with a concrete, ordered action plan (what to do first, why,
         expected impact).
    timeoutMs: 900000
  - id: verify
    command: bun test "D:\\projects\\obsidian\\second brain\\10-Projects\\11-Active\\agent-loop\\__tests__\\plan-schema.test.ts"
    timeoutMs: 120000